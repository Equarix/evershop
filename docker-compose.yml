version: '3.8'

services:
  app:
    build: .
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      PORT: ${PORT}
      EVERSHOP_HOST: ${EVERSHOP_HOST}
    networks:
      - myevershop
    depends_on:
      - database
    ports:
      - ${PORT}:${PORT}
  
  #The postgres database: 
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - myevershop
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT}:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - EVERSHOP_PORT=${PORT}
    restart: unless-stopped
    network_mode: host

networks:
  myevershop:
    name: MyEverShop
    driver: bridge

volumes:
  postgres-data:
